name: Build ve mevcut hosting'e yükle

# Ne zaman çalışır:
#   1) main dalına her push'ta (elle kod/içerik değişikliği yaptığında)
#   2) Supabase webhook'u tetiklediğinde (admin panelinden ürün ekleme/silme/düzenleme)
#   3) Actions sekmesinden "Run workflow" ile elle
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [supabase-update]
  workflow_dispatch: {}

# 27 Eylül 2026 kök neden analizi: Supabase webhook'u products tablosunda HER
# satır değişikliğinde (insert/update/delete) AYRI AYRI dispatch gönderiyor —
# debounce/batch yok. Toplu bir güncelleme (örn. tüm ürünlerin fiyatının
# yenilendiği bir işlem) saniyeler içinde onlarca dispatch'e yol açabiliyor
# (örn. 27 Eylül 16:24:45-50 arası, 5 saniyede 40+ run tetiklendi).
#
# ESKİ AYAR (cancel-in-progress: true) bu senaryoda YIKICI: her yeni webhook,
# hâlâ FTP transferi yapmakta olan bir önceki run'ı ORTASINDA öldürüyordu.
# FTP transferi atomik değil — iptal edilen bir run, sunucuda YARIM KALMIŞ,
# tutarsız bir dosya durumu bırakıyor (bazı dosyalar güncel, bazıları eski/
# eksik). GitHub Actions geçmişinde bu yüzden bazı commit'lerde 80 run'dan
# sadece 2'si tamamlanabilmiş — 78'i FTP transferi sırasında kesilmiş.
# Bu, canlı sitede /karsilastir/ sayfalarının çoğunun 404 vermesinin VE
# sitemap.xml'in eksik kalmasının doğrudan nedeniydi (AdSense'in "yapısal
# istikrar yok / düşük değerli içerik" tespitiyle örtüşüyor).
#
# YENİ AYAR (cancel-in-progress: false): çalışan bir run artık ASLA
# öldürülmüyor, güvenle bitiyor. Bu sırada gelen yeni tetiklemeler kuyruğa
# alınır — GitHub bu concurrency group için aynı anda sadece TEK bir run'ı
# kuyrukta tutar, art arda gelen fazla tetiklemeler otomatik olarak
# birbirinin yerine geçer (en güncel olan kuyrukta kalır). Sonuç: FTP
# transferi asla yarıda kesilmez, ama site yine de en güncel veriyle biter.
concurrency:
  group: teknoversus-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # contents: write — yalnızca deploy sonrası lib/yayinda-ciftler.txt'i geri yazmak için.
    permissions:
      contents: write
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Haber kapak görselleri (lib/news-images.js) ImageMagick ile üretiliyor.
      # ubuntu-latest'te genelde kurulu gelir; değilse kurar (~20 sn). Kurulum
      # başarısız olsa bile build durmaz, haberler görselsiz üretilir.
      - name: ImageMagick kontrolü (haber kapak görselleri için)
        run: |
          if command -v convert >/dev/null 2>&1 || command -v magick >/dev/null 2>&1; then
            echo "ImageMagick hazır: $(convert -version 2>/dev/null | head -1)"
          else
            sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick || echo "::warning::ImageMagick kurulamadı — haber kapak görselleri üretilmeyecek."
          fi

      - name: Siteyi Supabase'deki güncel veriyle üret (urun/*.html + sitemap.xml)
        run: node build.js
        env:
          # Not: shared.js'teki genel (publishable) anahtarla aynı — istersen
          # repo Secrets'a SUPABASE_URL / SUPABASE_KEY ekleyip override edebilirsin,
          # eklemezsen build.js içindeki varsayılan değerler kullanılır.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # ============================================================
      # 3 Ekim 2026 kök neden analizi: canlıdaki shared.js, 15 Eylül'den
      # kalma bozuk/eski bir kopyada hosting'in (LiteSpeed/Alastyr) sunucu
      # taraflı sayfa önbelleğinde HAFTALARCA takılı kalmış — her yeni
      # deploy dosyayı sunucuda doğru şekilde güncellese de, önbellek hiç
      # temizlenmediği için ziyaretçiler query string'siz "shared.js" isteği
      # attığında eski/bozuk içerik dönüyordu (cardHTML/brandFor gibi dosya
      # sonundaki tüm tanımlar canlıda aylarca tamamen eksikti — kategori
      # sayfalarında ürün kartlarının render edilememesinin asıl sebebi
      # buydu, CSV import'un hiçbir ilgisi yoktu). Çözüm: bu paylaşılan
      # betiklere yapılan HER referansa bir ?v=... sorgu dizesi ekliyoruz.
      #
      # 4 Ekim 2026 düzeltmesi: versiyon ilk halde HER deploy'da değişen
      # commit SHA'sıydı — bu da sadece TEK bir ürün eklense bile (ör. tek
      # bir telefon) sitedeki TÜM sayfaların (binlerce urun/*.html,
      # karsilastir/*.html, haberler/*.html dahil) içeriğini değiştirip
      # FTP-Deploy-Action'ın fark tabanlı senkronunu her seferinde TÜM
      # siteyi yeniden yüklemeye zorluyordu — bu da normal bir ürün
      # eklemesini bile 15-80+ dakikaya çıkarıyordu. Artık her dosyanın
      # versiyonu commit SHA'sı değil, o dosyanın KENDİ İÇERİK HASH'İ —
      # yani shared.js/styles.css gibi dosyalar değişmediği sürece onlara
      # yapılan referanslar da (dolayısıyla o referansı taşıyan HTML
      # sayfaları da) deploy'dan deploy'a birebir aynı kalıyor, FTP sadece
      # GERÇEKTEN değişen sayfaları (ör. yeni eklenen ürünün sayfası)
      # yüklüyor. shared.js/styles.css gerçekten değiştiğinde ise hash'i
      # değişir, TÜM site bir kerelik yeniden senkronize olur — bu doğru
      # ve nadir bir durum.
      - name: Paylaşılan script referanslarına cache-busting versiyonu ekle
        run: |
          python3 - <<'PYEOF'
          import re, pathlib, hashlib

          bust_files = [
              'shared.js', 'nlp-parser.js', 'performance-data.js',
              'product-filter.js', 'recommendation-reason.js',
              'category.js', 'product.js', 'styles.css', 'pwa.js',
          ]

          # Her dosyanın versiyonu KENDİ içerik hash'i (ilk 10 hex karakter) —
          # commit SHA değil. Böylece bu dosyalardan biri değişmediği sürece
          # ona olan referanslar da değişmiyor.
          versions = {}
          for fname in bust_files:
              p = pathlib.Path(fname)
              if p.exists():
                  versions[fname] = hashlib.sha1(p.read_bytes()).hexdigest()[:10]

          skip_dirs = {'.git', '.github', 'node_modules', 'lib'}
          changed = 0
          for path in pathlib.Path('.').rglob('*.html'):
              if any(part in skip_dirs for part in path.parts):
                  continue
              text = path.read_text(encoding='utf-8')
              original = text
              for fname, version in versions.items():
                  pattern = re.compile(r'(["\'])((?:\.\./)+|/)?' + re.escape(fname) + r'\1')

                  def repl(m, fname=fname, version=version):
                      quote, prefix = m.group(1), m.group(2) or ''
                      return f'{quote}{prefix}{fname}?v={version}{quote}'

                  text = pattern.sub(repl, text)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'{changed} HTML dosyasında script/style referansları versiyonlandı.')
          for fname, version in versions.items():
              print(f'  {fname} -> v={version}')
          PYEOF

      - name: FTP ile hosting'e yükle
        id: ftp
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Sunucuda kalması gereken ama repo'da olmayan dosyalara (örn. hosting'in
          # kendi sistem klasörleri) her deploy'da dokunma — sadece fark eden
          # dosyaları yükler/siler, tamamen silip yeniden yüklemez.
          dangerous-clean-slate: false
          # 27 Eylül 2026 kök neden analizi (çözüldü): canlı sitede
          # /karsilastir/ ve /inceleme/ sayfalarının büyük kısmı kayboluyordu.
          # Sebep FTP transferi DEĞİLDİ — hosting'in Imunify360 güvenlik
          # taraması, build.js'in ürettiği çok sayıda benzer şablonlu statik
          # sayfayı "php.tool.spam" imzasıyla yanlış pozitif eşleştirip
          # gerçek zamanlı olarak siliyordu (bkz. Alastyr destek talebi).
          # Alastyr hesaptan Imunify360 korumasını kaldırdı, sorun bu şekilde
          # kalıcı olarak çözüldü. `timeout`/`verbose` teşhis sürecinden
          # kalma, zararsız olduğu için bırakıldı.
          timeout: 120000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/lib/**
            build.js
            gen_product_pages.js
            gen_product_images.js
            package.json
            package-lock.json
            seed_products.sql
            seed_products_amazon.sql
            supabase_setup.sql
            AUTOMATION.md
            README.md

      # ============================================================
      # DEPLOY SONRASI DOĞRULAMA — FTP-Deploy-Action, dosya yükleme
      # hatalarında bile workflow'u "başarılı" gösterebiliyor (bilinen bir
      # sorun). Bu adım, build'in ürettiği sitemap.xml ile canlıdaki
      # sitemap.xml'in boyutunu karşılaştırır; büyük bir fark varsa build'i
      # BAŞARISIZ işaretler — böylece sessiz bir FTP başarısızlığı bir daha
      # fark edilmeden geçmez.
      # ============================================================
      - name: Deploy sonrası doğrulama (sitemap.xml / sitemap-1.xml boyut kontrolü)
        run: |
          # 28 Eylül 2026: sitemap.xml artık (WAF'ın büyük yanıtları kesmesi nedeniyle,
          # bkz. lib/split-sitemap.js) küçük bir "sitemap index" dosyası — asıl URL
          # verisini taşıyan sitemap-1.xml (varsa) ile birlikte ikisini de kontrol ediyoruz.
          check_file () {
            local FILE="$1"
            if [ ! -f "$FILE" ]; then
              echo "→ $FILE yerelde yok, atlanıyor."
              return 0
            fi
            local LOCAL_SIZE
            LOCAL_SIZE=$(wc -c < "$FILE")
            echo "Yerel $FILE boyutu: $LOCAL_SIZE byte"

            local LIVE_SIZE
            LIVE_SIZE=$(curl -sS -o /tmp/live-check.xml -w "%{size_download}" "https://teknoversus.com.tr/$FILE?cachebust=$(date +%s)" || echo "0")
            echo "Canlı $FILE boyutu: $LIVE_SIZE byte"

            if [ "$LIVE_SIZE" -eq 0 ]; then
              echo "::error::Canlı $FILE hiç indirilemedi — site erişilemez olabilir."
              return 1
            fi

            # %20'den fazla küçükse (FTP eksik/kısmi yüklemiş veya WAF kesmiş olabilir) uyar ve başarısız say.
            local DIFF_PERCENT=$(( (LOCAL_SIZE - LIVE_SIZE) * 100 / LOCAL_SIZE ))
            echo "Fark yüzdesi: %$DIFF_PERCENT (yerelin canlıdan ne kadar büyük olduğu)"

            if [ "$DIFF_PERCENT" -gt 20 ]; then
              echo "::error::Canlı $FILE, build'in ürettiğinden çok daha küçük (%$DIFF_PERCENT fark). FTP yüklemesi eksik kalmış ya da hosting WAF'ı yanıtı kesiyor olabilir — deploy'u başarısız işaretliyorum."
              return 1
            fi

            echo "✅ Canlı $FILE, build çıktısıyla makul ölçüde eşleşiyor."
            return 0
          }

          FAILED=0
          check_file "sitemap.xml" || FAILED=1
          check_file "sitemap-1.xml" || FAILED=1

          # 3 Ekim 2026 kök neden analizi: shared.js, 28 Eylül'deki bir deploy'da
          # FTP yüklemesi YARIM kalmış (41198 → 31784 byte) ve o tarihten beri
          # git'te değişmediği için FTP-Deploy-Action'ın fark tabanlı senkronu
          # bozuk kopyayı AYLARCA fark etmeden canlıda bırakmış — cardHTML/
          # brandFor gibi dosya sonuna yakın tüm tanımlar canlıda hiç yoktu.
          # Sitemap kontrolü bunu yakalamıyordu çünkü sadece sitemap.xml'e
          # bakıyordu. Artık sayfaların <script> ile dinamik yüklediği TÜM
          # paylaşılan betikler her deploy'da aynı şekilde kontrol ediliyor.
          check_file "shared.js" || FAILED=1
          check_file "nlp-parser.js" || FAILED=1
          check_file "performance-data.js" || FAILED=1
          check_file "product-filter.js" || FAILED=1
          check_file "recommendation-reason.js" || FAILED=1
          check_file "category.js" || FAILED=1
          check_file "styles.css" || FAILED=1

          if [ "$FAILED" -eq 1 ]; then
            exit 1
          fi

      # ============================================================
      # 22 Ekim 2026: Yayındaki karşılaştırma kaydını (lib/yayinda-ciftler.txt)
      # repoya geri yaz. Bir sonraki build bu listedeki ikilileri yine üretir
      # ya da yönlendirir; böylece skor komşuluğu kaydığında sayfalar 404
      # olmaz (bkz. lib/pair-registry.js). Sadece FTP yüklemesi başarılıysa
      # çalışır. GITHUB_TOKEN ile yapılan push yeni bir workflow tetiklemez.
      # Kayıt değişmediyse hiçbir şey yapmaz.
      # ============================================================
      - name: Yayındaki karşılaştırma kaydını repoya yaz
        if: always() && steps.ftp.outcome == 'success'
        run: |
          set -e
          REG=lib/yayinda-ciftler.txt
          [ -f "$REG" ] || { echo "Kayıt dosyası yok, atlanıyor."; exit 0; }
          cp "$REG" /tmp/yayinda-ciftler.txt
          git config user.name "teknoversus-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch -q --depth=1 origin main
            git checkout -q -f -B kayit-guncelle origin/main
            cp /tmp/yayinda-ciftler.txt "$REG"
            if git diff --quiet -- "$REG"; then echo "Kayıt değişmemiş."; exit 0; fi
            git add "$REG"
            git commit -q -m "Yayındaki karşılaştırma kaydı güncellendi [skip ci]"
            if git push -q origin HEAD:main; then echo "Kayıt main'e yazıldı."; exit 0; fi
            echo "Push reddedildi (main bu arada değişmiş), tekrar deneniyor ($i)..."
            sleep 5
          done
          echo "::warning::Karşılaştırma kaydı repoya yazılamadı; bir sonraki deploy'da tekrar denenecek."
