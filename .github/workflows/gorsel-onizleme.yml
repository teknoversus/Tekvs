name: Gorsel onizleme
on:
  push:
    branches: [analiz-test]
    paths: ['onizleme/**']
jobs:
  onizle:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Indir ve kontak sayfasi uret
        run: |
          URLS="$(cat onizleme/urls.txt)"
          sudo apt-get -qq install -y imagemagick >/dev/null 2>&1 || true
          mkdir -p img out
          i=0
          echo "$URLS" | tr ';' '\n' | while IFS='|' read -r label url; do
            [ -z "$url" ] && continue
            i=$((i+1))
            f="img/$(printf '%02d' $i)"
            if curl -sSL -A "Mozilla/5.0" --max-time 40 -o "$f.src" "$url"; then
              convert "$f.src[0]" -auto-orient -background white -alpha remove -resize 400x260 -gravity center -extent 400x260 -gravity south -background '#000' -splice 0x22 -fill white -pointsize 16 -annotate +0+2 "$(printf '%02d' $i) $label" "$f.png" 2>/dev/null || echo "CONVERT FAIL $label"
            else echo "DL FAIL $label"; fi
          done
          : > out/links.txt
          [ -f onizleme/sayfalar.txt ] && python3 onizleme/tara.py || true
          for f in img/*.src; do echo "$f $(identify -format '%wx%h' "$f[0]" 2>/dev/null)" >> out/links.txt; done
          montage img/*.png -tile 4x -geometry +4+4 out/sheet.png
          ls -la img out
      - name: Sonucu dala yaz
        run: |
          git config user.name "gorsel-bot"; git config user.email "bot@teknoversus.com.tr"
          git checkout --orphan onizleme-sonuc
          git rm -rq --cached . || true
          cp out/sheet.png sheet.png; cp out/links.txt links.txt
          git add -f sheet.png links.txt
          git commit -qm "onizleme [skip ci]"
          git push -f origin onizleme-sonuc
