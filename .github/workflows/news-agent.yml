name: Haber agent'ı (haftada 2 kez, onay bekleyen taslak üretir)

# Bu workflow SİTEYİ DEPLOY ETMEZ — sadece Claude API + web search kullanarak
# güncel bir teknoloji haberi bulup Supabase'e "onay bekliyor" (pending_review:
# true) olarak ekler. Admin panelinden onaylanmadan hiçbir zaman siteye çıkmaz.
#
# Onaylandığında (admin panelinden "Onayla ve yayınla"), mevcut news webhook'u
# zaten otomatik olarak deploy.yml'i tetikleyip siteye yayınlayacaktır — bu
# workflow'un o kısımla bir ilgisi yok.
on:
  schedule:
    # Her Salı ve Cuma 08:00 UTC (Türkiye saatiyle 11:00, yaz saati farkına göre değişebilir).
    # Sıklığı değiştirmek istersen bu satırı düzenle: https://crontab.guru
    - cron: '0 8 * * 2,5'
  workflow_dispatch: {}  # Actions sekmesinden elle "Run workflow" ile de tetiklenebilir (test için)

jobs:
  generate-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Haber araştır, yaz, "onay bekliyor" olarak ekle
        run: node scripts/generate-news-agent.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
