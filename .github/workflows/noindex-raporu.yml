name: noindex raporu (sadece ölçer, deploy ETMEZ)

# Elle çalıştırılır (Actions → "noindex raporu" → Run workflow).
# Siteyi üretir, raporu hesaplar, sonucu "rapor-noindex" dalına yazar.
# FTP adımı yok; canlı siteye dokunmaz. deploy.yml'in concurrency grubunu kullanmaz.
on:
  workflow_dispatch: {}

jobs:
  rapor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Siteyi üret (yalnızca ölçüm için)
        run: node build.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      - name: Raporu hesapla
        run: node scripts/noindex-raporu.js
      - name: Veri dökümü (ürün ve haber)
        run: |
          mkdir -p rapor
          curl -s "$SUPABASE_URL/rest/v1/products?select=id,name,cat,specs,added_at,upcoming&deleted=eq.false" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Range: 0-4999" > rapor/products.json
          curl -s "$SUPABASE_URL/rest/v1/news?select=id,title,date,summary,body&deleted=eq.false" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" > rapor/news.json
          for f in marka/samsung-telefon.html marka-karsilastir/axen-vs-vestel-televizyon.html televizyon-sayfa-10.html inceleme/apple-watch-series-8-h27-inceleme.html; do mkdir -p rapor/ornek/$(dirname $f); cp $f rapor/ornek/$f || true; done
        env:
          SUPABASE_URL: https://qsetmleywkhjcntajphx.supabase.co
          SUPABASE_KEY: sb_publishable_z74ZnvDgMWR7JzQDezgdqg_G_eh3e5B
      - name: Site denetimi
        run: node scripts/site-denetim.js
      - name: Raporu rapor-noindex dalına yaz
        run: |
          git config user.name "teknoversus-bot"
          git config user.email "bot@teknoversus.com.tr"
          git checkout -B rapor-denetim
          git add -f rapor
          git commit -m "site denetimi [skip ci]"
          git push -f origin rapor-denetim
