name: site tarama (gecici)
on:
  push:
    paths: ['tarama/tetik.txt']
jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node tarama/tarama2.js
        timeout-minutes: 18
        continue-on-error: true
      - name: Sonucu tarama-sonuc dalina yaz
        run: |
          git config user.name "teknoversus-bot"
          git config user.email "bot@teknoversus.com.tr"
          git checkout --orphan tarama-sonuc
          git rm -rf -q --cached . >/dev/null 2>&1 || true
          git add -f rapor
          git commit -q -m "tarama sonucu"
          git push -f origin tarama-sonuc
